name: Release

# Push a tag vX.Y.Z on a commit of main that passed CI to publish the installer. The tag is
# the version (ctgedit/buildinfo.py). The commit's own CI run is the test gate.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # (waits for the commit's CI run when the commit and the tag were pushed together)
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # CI's runs on this exact commit: a push to main, or a manual run
          runs() {
            gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 50 \
              --json databaseId,event,status,conclusion \
              --jq '.[] | select(.event == "push" or .event == "workflow_dispatch") | "\(.databaseId) \(.status) \(.conclusion)"'
          }
          if runs | grep -q " completed success$"; then
            echo "CI passed on $GITHUB_SHA."
            exit 0
          fi
          id=$(runs | awk '$2 != "completed" { print $1; exit }')
          if [ -n "$id" ]; then
            echo "Waiting for CI run $id."
            if gh run watch "$id" --exit-status --interval 60 > /dev/null; then
              echo "CI passed on $GITHUB_SHA."
              exit 0
            fi
          fi
          echo "::error::CI has not passed on $GITHUB_SHA. Push it to main or run CI on the tag, then re-run this workflow."
          exit 1

  installer:
    needs: check
    uses: ./.github/workflows/installer.yml

  publish:
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=${GITHUB_REF_NAME#v}
          # (the build read its version from this tag)
          if [ ! -f "dist/ctgedit-$v-setup.exe" ]; then
            echo "::error::The installer is not version $v: $(ls dist)."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "dist/ctgedit-$v-setup.exe" \
            --verify-tag --title "ctgedit $v" --generate-notes
